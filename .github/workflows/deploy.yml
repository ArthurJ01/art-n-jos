# Continuous Delivery pipeline. On every push to main:
#
#   CI  ->  build image  ->  deploy to dev  ->  (approval)  ->  deploy to prod
#
# The SAME Docker image (identified by its digest) is deployed to both
# environments, so what you tested on dev is exactly what goes to prod.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you start it manually from the Actions tab

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry (ghcr.io)
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.name }}:latest
            ${{ steps.name.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the exact image by digest
        id: ref
        run: echo "image=${{ steps.name.outputs.name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Deploys are skipped until you set the repository variable DEPLOY_ENABLED=true
  # (Settings -> Secrets and variables -> Actions -> Variables), i.e. once
  # Neon + Render are set up. See docs/SETUP.md.
  deploy-dev:
    name: Deploy to dev
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: dev
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  deploy-prod:
    name: Deploy to prod
    needs: [build, deploy-dev]
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
