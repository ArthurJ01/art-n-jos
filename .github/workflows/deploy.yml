# Continuous Delivery pipeline. Each long-lived branch deploys its own environment:
#
#   push to dev   ->  CI  ->  deploy to dev
#   push to main  ->  CI  ->  deploy to prod
#
# Feature branches merge into dev. When dev looks good on the dev site, a
# dev -> main pull request ("release") ships it to prod. release-source.yml
# makes sure main only receives pull requests from dev.
#
# Each deploy migrates that environment's database first, then builds the app
# with the Vercel CLI and uploads it. Vercel's own "deploy on every push" is
# switched off in vercel.json, so GitHub Actions is the only thing that deploys.
name: Deploy

on:
  push:
    branches: [dev, main]
  # Lets you start it manually from the Actions tab. The branch you pick
  # decides which environment is deployed.
  workflow_dispatch:

# Never run two deploys of the same environment at once; queue them instead.
# Each branch has its own queue, so a prod release never blocks a dev deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Deploys are skipped until you set the repository variable DEPLOY_ENABLED=true
  # (Settings -> Secrets and variables -> Actions -> Variables), i.e. once
  # Neon + Vercel are set up. See docs/SETUP.md.
  deploy-dev:
    name: Deploy to dev
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      vercel-target: preview
    secrets: inherit

  deploy-prod:
    name: Deploy to prod
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      vercel-target: production
    secrets: inherit
