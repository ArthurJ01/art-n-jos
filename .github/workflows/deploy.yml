# Continuous Delivery pipeline. On every push to main:
#
#   CI  ->  deploy to dev  ->  (your approval)  ->  deploy to prod
#
# Each deploy step migrates that environment's database first, then builds the
# app with the Vercel CLI and uploads it. Vercel's own "deploy on every push" is
# switched off in vercel.json, so GitHub Actions is the only thing that deploys.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you start it manually from the Actions tab

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Deploys are skipped until you set the repository variable DEPLOY_ENABLED=true
  # (Settings -> Secrets and variables -> Actions -> Variables), i.e. once
  # Neon + Vercel are set up. See docs/SETUP.md.
  deploy-dev:
    name: Deploy to dev
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      vercel-target: preview
    secrets: inherit

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      vercel-target: production
    secrets: inherit
