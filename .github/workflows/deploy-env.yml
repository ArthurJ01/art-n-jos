# Reusable "deploy one environment" workflow, called by deploy.yml for dev and prod.
#
# Each GitHub Environment (Settings -> Environments) must define:
#   secrets.DATABASE_URL            Neon connection string for that environment
#   secrets.RENDER_DEPLOY_HOOK_URL  Deploy hook from the Render service's Settings page
#   vars.APP_URL                    e.g. https://art-web-dev.onrender.com
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        description: Full image reference including digest (ghcr.io/owner/repo@sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Using a GitHub Environment gives us per-environment secrets, a deployment
    # history, and (for production) a "required reviewers" approval gate.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrations run BEFORE the new code goes live, using the migration files
      # shipped inside the image itself. Write migrations that the *old* code
      # can also live with (add columns, don't rename/drop in the same deploy).
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE: ${{ inputs.image }}
        run: docker run --rm -e DATABASE_URL "$IMAGE" node apps/api/dist/db/migrate.js

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ inputs.image }}
        run: |
          encoded=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          curl --fail-with-body -sS -X POST "${HOOK}&imgURL=${encoded}"

      # Render deploys in the background. Poll /api/health until it reports the
      # commit we just built, so the pipeline only goes green when it's really live.
      - name: Wait until the new version is live
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            version=$(curl -fsS --max-time 60 "$APP_URL/api/health" | jq -r .version || true)
            echo "Attempt $i: live version is '${version}', waiting for '${EXPECTED}'"
            if [ "$version" = "$EXPECTED" ]; then
              echo "Deployed ✅"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the deploy. Check the Render dashboard logs."
          exit 1
