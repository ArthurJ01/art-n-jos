# Makes sure main only receives pull requests from dev, so everything reaches
# prod through the dev site first. Mark the "PRs to main come from dev" check
# as required in the main branch ruleset (see docs/SETUP.md step 7), otherwise
# it only warns.
name: Release source

on:
  pull_request:
    branches: [main]
    # "edited" re-runs the check when a pull request is retargeted to main.
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  from-dev:
    name: PRs to main come from dev
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check that this pull request comes from dev
        env:
          # Passed through env, never pasted into the script: a branch name is
          # chosen by whoever opens the pull request.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Also check the repository: a fork could have its own branch called "dev".
          if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "OK: this release comes from dev."
            exit 0
          fi
          echo "::error::Pull requests into main must come from dev (this one is from '$HEAD_REPO:$HEAD_REF'). Merge your branch into dev first, then open a dev -> main pull request."
          exit 1
